# Patient API: Deployment (2 replicas) + NodePort Service (the only public entry point).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-api
  labels:
    app: patient-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-api
  template:
    metadata:
      labels:
        app: patient-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: patient-api
        image: patient-api:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: patient-db              # Service name, resolved by cluster DNS
        - name: DB_CONNECT_RETRIES
          value: "20"                    # ~60 s to wait for PostgreSQL on first start
        - name: DB_NAME
          valueFrom: {secretKeyRef: {name: patient-db-secret, key: POSTGRES_DB}}
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: patient-db-secret, key: POSTGRES_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: patient-db-secret, key: POSTGRES_PASSWORD}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: patient-api
spec:
  type: NodePort
  selector:
    app: patient-api
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30080

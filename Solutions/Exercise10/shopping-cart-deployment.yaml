# shopping-cart-deployment.yaml (brief Step 6, with the clean-ups in README section 7)
# Shopping Cart (AppB): 3 replicas, one per node via required pod anti-affinity
# on topologyKey kubernetes.io/hostname. The brief puts this Deployment in
# namespace "devops-exercise" while its Service lives in "default" (and the
# namespace is never created) - fixed to "default" here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-cart
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopping-cart
  template:
    metadata:
      labels:
        app: shopping-cart
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: shopping-cart
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: shopping-cart-container
        image: shopping-cart:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
